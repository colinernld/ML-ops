# MinIO: S3-compatible storage for MLflow artifacts (models, reports). Data on a persistent volume.
# The official minio/minio image is no longer published; pgsty/minio is the maintained community build.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  labels: {app.kubernetes.io/name: minio}
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: minio}
  template:
    metadata:
      labels: {app.kubernetes.io/name: minio}
    spec:
      containers:
        - name: minio
          image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
          args: ["server", "/data", "--console-address", ":9001"]
          ports:
            - {name: api, containerPort: 9000}
            - {name: console, containerPort: 9001}
          env:
            - name: MINIO_ROOT_USER
              valueFrom: {secretKeyRef: {name: ride-secrets, key: MINIO_ROOT_USER}}
            - name: MINIO_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: ride-secrets, key: MINIO_ROOT_PASSWORD}}
          readinessProbe:
            httpGet: {path: /minio/health/ready, port: api}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /minio/health/live, port: api}
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - {name: data, mountPath: /data}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 5Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  labels: {app.kubernetes.io/name: minio}
spec:
  selector: {app.kubernetes.io/name: minio}
  ports:
    - {name: api, port: 9000, targetPort: api}
---
# MinIO web console on http://localhost:30901 (Docker Desktop exposes NodePorts on localhost).
apiVersion: v1
kind: Service
metadata:
  name: minio-console
  labels: {app.kubernetes.io/name: minio}
spec:
  type: NodePort
  selector: {app.kubernetes.io/name: minio}
  ports:
    - {name: console, port: 9001, targetPort: console, nodePort: 30901}
