# MLflow tracking server + model registry. Metadata in Postgres, artifacts in MinIO (proxied by the
# server: clients only need MLFLOW_TRACKING_URI). UI on http://localhost:30550.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  labels: {app.kubernetes.io/name: mlflow}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: mlflow}
  template:
    metadata:
      labels: {app.kubernetes.io/name: mlflow}
    spec:
      initContainers:
        # Wait for Postgres, then create the MinIO bucket MLflow writes to (idempotent).
        - name: wait-postgres
          image: postgres:17.11
          command: ["sh", "-c", "until pg_isready -h postgres -p 5432; do echo waiting for postgres; sleep 2; done"]
        - name: create-bucket
          image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
          command:
            - sh
            - -c
            - >
              until mc alias set store http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD";
              do echo waiting for minio; sleep 2; done
              && mc mb --ignore-existing "store/$MLFLOW_BUCKET"
          env:
            - name: MINIO_ROOT_USER
              valueFrom: {secretKeyRef: {name: ride-secrets, key: MINIO_ROOT_USER}}
            - name: MINIO_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: ride-secrets, key: MINIO_ROOT_PASSWORD}}
            - name: MLFLOW_BUCKET
              valueFrom: {configMapKeyRef: {name: ride-config, key: MLFLOW_BUCKET}}
            - name: HOME
              value: /tmp
      containers:
        - name: mlflow
          image: ride-mlflow
          command: ["mlflow", "server"]
          args:
            - --host=0.0.0.0
            - --port=5000
            - --workers=1          # default is 4 web workers: too much memory for a laptop cluster
            - --backend-store-uri=postgresql+psycopg2://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)
            - --serve-artifacts
            - --artifacts-destination=s3://$(MLFLOW_BUCKET)
          ports:
            - {name: http, containerPort: 5000}
          env:
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: ride-secrets, key: POSTGRES_USER}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: ride-secrets, key: POSTGRES_PASSWORD}}
            - name: POSTGRES_DB
              valueFrom: {configMapKeyRef: {name: ride-config, key: POSTGRES_DB}}
            - name: MLFLOW_BUCKET
              valueFrom: {configMapKeyRef: {name: ride-config, key: MLFLOW_BUCKET}}
            - name: MLFLOW_SERVER_ALLOWED_HOSTS
              valueFrom: {configMapKeyRef: {name: ride-config, key: MLFLOW_SERVER_ALLOWED_HOSTS}}
            # MLflow 3.x starts background job workers by default (GenAI evaluation jobs we do not use):
            # they made the pod run out of memory on a laptop cluster.
            - name: MLFLOW_SERVER_ENABLE_JOB_EXECUTION
              value: "false"
            - name: MLFLOW_S3_ENDPOINT_URL
              value: http://minio:9000
            - name: AWS_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: ride-secrets, key: MINIO_ROOT_USER}}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: ride-secrets, key: MINIO_ROOT_PASSWORD}}
          # Probes send Host: localhost: MLflow rejects unknown Host headers (the pod IP would get 403).
          startupProbe:
            httpGet: {path: /health, port: http, httpHeaders: [{name: Host, value: localhost}]}
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: {path: /health, port: http, httpHeaders: [{name: Host, value: localhost}]}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http, httpHeaders: [{name: Host, value: localhost}]}
            periodSeconds: 20
            failureThreshold: 5
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {memory: 2Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  labels: {app.kubernetes.io/name: mlflow}
spec:
  type: NodePort
  selector: {app.kubernetes.io/name: mlflow}
  ports:
    - {name: http, port: 5000, targetPort: http, nodePort: 30550}
