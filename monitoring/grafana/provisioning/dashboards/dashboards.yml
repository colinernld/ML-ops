# Loads every dashboard JSON found in /etc/grafana/dashboards (monitoring/grafana/dashboards/ in the repo).
# Dashboards are code: edit the JSON in git, not in the UI (UI changes are not saved).
apiVersion: 1
providers:
  - name: ride-mlops
    folder: Ride MLOps
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/dashboards
