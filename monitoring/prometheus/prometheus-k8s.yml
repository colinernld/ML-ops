# Prometheus for production (Kubernetes, namespace ride-mlops), mounted from a ConfigMap generated by
# monitoring/kustomization.yaml. Same jobs as prometheus.yml (dev), except that the API pods are
# discovered through their prometheus.io/* annotations (k8s/api.yaml): every replica is scraped on its
# own, so counters stay correct with 2+ replicas and during rolling updates.
# Checked by CI: promtool check config. See docs/monitoring.md.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: production

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Service, input data and model output layers: the API's own metrics, one target per API pod.
  - job_name: ride-api
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          own_namespace: true
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        action: keep
        regex: api
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        regex: (.+)
        target_label: __metrics_path__
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod

  # Infrastructure layer: every service answers its health check (same Service names as in Compose).
  - job_name: health-checks
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://api:8000/ready"]
        labels: {service: api}
      - targets: ["http://webapp:8501/_stcore/health"]
        labels: {service: webapp}
      - targets: ["http://mlflow:5000/health"]
        labels: {service: mlflow}
      - targets: ["http://minio:9000/minio/health/live"]
        labels: {service: minio}
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: health-checks-tcp
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets: ["postgres:5432"]
        labels: {service: postgres}
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
