# Blackbox exporter: Prometheus asks it to call each service's health check (monitoring/prometheus/*.yml,
# jobs health-checks*) and records probe_success (1 = healthy) and probe_duration_seconds.
modules:
  http_2xx:
    prober: http
    timeout: 5s
    http:
      preferred_ip_protocol: ip4
      valid_status_codes: []   # empty = any 2xx
  tcp_connect:
    prober: tcp
    timeout: 5s
    tcp:
      preferred_ip_protocol: ip4
