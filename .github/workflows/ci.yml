# Continuous integration: runs on every pull request and every push to main.
# Make "lint-and-test" and "manifests" required status checks in the `protect-main` ruleset.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies (CPU-only PyTorch, same version as the API image)
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.14.1"
          pip install -e ".[dev,mlflow,api]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest)
        # Unit, validation, API and end-to-end pipeline tests. They use synthetic rides:
        # the real dataset is not needed (and never in git).
        run: pytest -q --junitxml=pytest-report.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest-report.xml

  manifests:
    name: manifests (Dockerfiles + Kubernetes)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Lint Dockerfiles (hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          recursive: true
          dockerfile: "Dockerfile"
          failure-threshold: warning

      - name: Validate Kubernetes manifests (kustomize + kubeconform)
        run: |
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin kubeconform
          kubectl kustomize k8s > rendered.yaml
          kubeconform -strict -summary -kubernetes-version 1.34.0 rendered.yaml

  monitoring:
    name: monitoring (Prometheus, alert rules, Compose)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROMETHEUS_IMAGE: prom/prometheus:v3.15.1      # same versions as docker-compose.yml and monitoring/k8s/
      BLACKBOX_IMAGE: prom/blackbox-exporter:v0.29.1
    steps:
      - uses: actions/checkout@v4

      - name: Prometheus configs, dev and production (promtool check config)
        run: |
          for f in prometheus.yml prometheus-k8s.yml; do
            docker run --rm -v "$PWD/monitoring/prometheus:/etc/prometheus:ro" --entrypoint promtool \
              "$PROMETHEUS_IMAGE" check config "/etc/prometheus/$f"
          done

      - name: Alert rules unit tests (promtool test rules)
        run: |
          docker run --rm -v "$PWD/monitoring/prometheus:/etc/prometheus:ro" -w /etc/prometheus \
            --entrypoint promtool "$PROMETHEUS_IMAGE" test rules alerts_test.yml

      - name: Blackbox exporter config
        run: |
          docker run --rm -v "$PWD/monitoring/blackbox:/etc/blackbox:ro" "$BLACKBOX_IMAGE" \
            --config.file=/etc/blackbox/blackbox.yml --config.check

      - name: Docker Compose file, every profile (docker compose config)
        run: |
          cp .env.example .env
          docker compose --profile airflow --profile monitoring config --quiet
