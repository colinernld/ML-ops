# MLflow tracking server + model registry, backed by Postgres (metadata) and MinIO (artifacts).
#
#   cp .env.example .env        # once, then change the passwords
#   docker compose up -d        # MLflow UI: http://localhost:5050   MinIO console: http://localhost:9001
#                               # API: http://localhost:8000/docs     Web app: http://localhost:8501
#   docker compose --profile monitoring up -d   # + Prometheus http://localhost:9090, Grafana http://localhost:3000
#   docker compose down         # stop (data is kept in Docker volumes; add -v to wipe it)
#
# Clients (training, API) only need MLFLOW_TRACKING_URI: the server proxies artifact uploads and
# downloads to MinIO, so MinIO credentials never leave this file. See docs/mlflow.md.

name: ride-mlops

x-minio-image: &minio-image
  # The official minio/minio image is no longer published; pgsty/minio is the maintained community build.
  image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z

services:
  minio:
    <<: *minio-image
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?copy .env.example to .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?copy .env.example to .env}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # One-shot job: creates the bucket MLflow writes to, then exits.
  minio-init:
    <<: *minio-image
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MLFLOW_BUCKET: ${MLFLOW_BUCKET:-mlflow}
    entrypoint: >
      sh -c 'mc alias set store http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
      && mc mb --ignore-existing "store/$$MLFLOW_BUCKET"'
    restart: "no"

  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:-mlflow}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  mlflow:
    build: docker/mlflow
    image: ride-mlops/mlflow:3.18.0
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      # Host names the server answers to; MLflow rejects any other Host header (DNS-rebinding protection).
      MLFLOW_SERVER_ALLOWED_HOSTS: ${MLFLOW_ALLOWED_HOSTS:-localhost,localhost:*,127.0.0.1,127.0.0.1:*,mlflow,mlflow:*}
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mlflow}
      --serve-artifacts
      --artifacts-destination s3://${MLFLOW_BUCKET:-mlflow}
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5050}:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # Prediction API (FastAPI): http://localhost:8000/docs. Serves models:/ride-classifier@production;
  # until a model is promoted it starts anyway and /ready answers 503 (see docs/api.md).
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    image: ${IMAGE_NAMESPACE:-ride-mlops}/ride-api:${IMAGE_TAG:-dev}
    depends_on:
      mlflow:
        condition: service_healthy
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_URI: ${MODEL_URI:-models:/ride-classifier@production}
      RELOAD_TOKEN: ${RELOAD_TOKEN:-}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    restart: unless-stopped

  # Web app (Streamlit): http://localhost:8501. Calls the API only.
  webapp:
    build:
      context: .
      dockerfile: docker/webapp/Dockerfile
    image: ${IMAGE_NAMESPACE:-ride-mlops}/ride-webapp:${IMAGE_TAG:-dev}
    depends_on:
      api:
        condition: service_started
    environment:
      API_URL: http://api:8000
    ports:
      - "127.0.0.1:${WEBAPP_PORT:-8501}:8501"
    restart: unless-stopped

  # Training pipeline (issue #6): Airflow UI http://localhost:8080, DAG "ride_classifier_training".
  # Optional, start it with:  docker compose --profile airflow up -d   (see docs/pipeline.md)
  airflow:
    profiles: ["airflow"]
    build: docker/airflow
    image: ride-mlops/airflow:3.4.0
    command: airflow standalone
    user: "${AIRFLOW_UID:-50000}:0"
    depends_on:
      mlflow:
        condition: service_healthy
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      # API to reload after a promotion. Default: the `api` container of this Compose project.
      API_URL: ${PIPELINE_API_URL:-http://api:8000}
      RELOAD_TOKEN: ${RELOAD_TOKEN:-}
      # Dev only: no login screen (every visitor is admin). Ports are bound to 127.0.0.1 anyway.
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/opt/project   # code, params.yaml, dags/, data/raw (input) and data/processed + artifacts/ (outputs)
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/v2/monitor/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  # Monitoring (optional): Prometheus http://localhost:9090, Grafana http://localhost:3000.
  #   docker compose --profile monitoring up -d          (see docs/monitoring.md)
  # Same config files as production (monitoring/), Kubernetes only swaps prometheus.yml for prometheus-k8s.yml.
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped

  # Calls the health check of every service for Prometheus (infrastructure layer).
  blackbox:
    profiles: ["monitoring"]
    image: prom/blackbox-exporter:v0.29.1
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ./monitoring/blackbox:/etc/blackbox:ro
    restart: unless-stopped

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:12.4.15
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Dev only: the dashboard opens without login (read-only); log in as admin to edit.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/ride-api.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  minio-data:
  postgres-data:
  prometheus-data:
  grafana-data:
