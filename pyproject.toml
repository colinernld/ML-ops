[project]
name = "trajclf"
version = "0.1.0"
description = "MLOps project - ride classification from IMU signals (GBG500)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "pyyaml>=6",
    "scikit-learn>=1.4",
    "torch>=2.2",
]

[project.optional-dependencies]
mlflow = ["mlflow>=3.0", "boto3>=1.34"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9", "prometheus-client>=0.20"]
webapp = ["streamlit>=1.40", "requests>=2.32"]
dev = ["pytest>=8", "ruff>=0.5", "matplotlib>=3.8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
